services:

  postgres:
    image: postgres:16-alpine
    container_name: ycyw-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ycyw-network

  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: ycyw-chat-back
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/chat/rooms || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - ycyw-network

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: ycyw-chat-front
    ports:
      - "4200:80"
    depends_on:
      back:
        condition: service_healthy
    networks:
      - ycyw-network

volumes:
  ycyw_pgdata:

networks:
  ycyw-network:
    driver: bridge